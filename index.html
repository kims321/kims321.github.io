<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>制作サンプル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="portfolio">
  <main class="portfolio-main">
    <header class="page-header">
      <h1>制作サンプル</h1>
      <p>業種ごとの見本です。掲載している会社・店舗・施設はすべて架空です。</p>
    </header>

    <div class="sample-grid">
      <!-- カード1件の開始：追加するときは、この開始から終了までをコピー -->
      <article class="sample-card">
        <div class="sample-images">
          <img class="sample-pc" src="images/golf-pc.jpg" width="1280" height="800"
               alt="風見ヶ丘ゴルフガーデンのパソコン画面">
          <img class="sample-sp" src="images/golf-sp.jpg" width="416" height="900"
               alt="風見ヶ丘ゴルフガーデンのスマホ画面">
        </div>
        <div class="sample-content">
          <p class="sample-tag">スポーツ施設</p>
          <h2>ゴルフ練習場「風見ヶ丘ゴルフガーデン」</h2>
          <p class="sample-features">6ページ・料金表・Googleマップ・お問い合わせフォーム・スマホ対応</p>
          <a class="sample-link" href="https://kims321.github.io/golf-sample/" target="_blank" rel="noopener noreferrer">サイトを見る</a>
        </div>
      </article>
      <!-- カード1件の終了 -->
      <article class="sample-card">
        <div class="sample-images">
          <img class="sample-pc" src="images/vehicle-pc.jpg" width="1280" height="800"
               alt="車両管理システムのパソコン画面">
          <img class="sample-sp" src="images/vehicle-sp.jpg" width="416" height="900"
               alt="車両管理システムのスマホ画面">
        </div>
        <div class="sample-content">
          <p class="sample-tag">業務システム</p>
          <h2>社内の車両管理システム「サンプル工業株式会社」</h2>
          <p class="sample-features">車両台帳・車検期限・修理の記録・事業部別の費用と前期比較・役職ごとの権限・スマホ対応</p>
          <a class="sample-link" href="https://kims321.github.io/vehicle-sample/" target="_blank" rel="noopener noreferrer">画面を見る</a>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
